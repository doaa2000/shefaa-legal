<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تم تأكيد بريدك — شفاء</title>
<meta name="description" content="تم تأكيد بريدك الإلكتروني في تطبيق شفاء.">
<link rel="stylesheet" href="style.css">
<style>
  .done { text-align: center; padding: 56px 0 8px; }
  .mark {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--brand); color: #fff;
    font-size: 44px; line-height: 84px;
    margin: 0 auto 24px;
  }
  .done h1 { font-size: 27px; margin: 0 0 10px; }
  .done p { color: var(--ink-soft); margin: 0 0 6px; }
  .en-done { direction: ltr; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="wrap">

  <div class="done">
    <div class="mark">&#10003;</div>
    <h1>تم تأكيد بريدك الإلكتروني</h1>
    <p>ارجع إلى تطبيق شفاء وسجّل الدخول للبدء في الحجز.</p>
    <p>يمكنك إغلاق هذه الصفحة.</p>

    <div class="en-done">
      <h1>Your email is confirmed</h1>
      <p>Return to the Shefaa app and sign in to start booking.</p>
      <p>You can close this page.</p>
    </div>
  </div>

  <footer style="text-align:center">شفاء · Shefaa — حجز مواعيد الأطباء</footer>

</div>
</body>
</html>
